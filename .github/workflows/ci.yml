name: CI
on: [push, pull_request]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc -p .
      - run: npx vitest run
      - name: No exam content or tokens in this public repo
        working-directory: .
        run: |
          ! git ls-files | grep -iE '\.pdf$|bundles/|silver/|questions.*\.json$'
          ! git grep -nE 'github_pat_[A-Za-z0-9_]{20,}' -- . ':!app/src/ui/App.tsx'
